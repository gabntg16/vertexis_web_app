name: vertexis
description: Centralized Branch Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  intl: ^0.19.0
  uuid: ^4.3.3
  table_calendar: ^3.1.0
  fl_chart: ^0.66.2
  cached_network_image: ^3.3.1
  path_provider: ^2.1.2
  google_fonts: ^6.1.0
  url_launcher: ^6.3.2
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.2.0
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
